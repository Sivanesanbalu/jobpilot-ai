name: Backend checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Compile backend modules
        run: python -m compileall -q app.py resume_intelligence.py job_discovery_watch.py discovery_state.py discovery_worker.py discovery_scheduler.py supabase_discovery_worker.py postgres_discovery_repository.py worker_runtime.py application_review.py application_draft.py
      - name: Validate inline dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inline=[]; self.active=False; self.buffer=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='script':
                      self.active=True; self.buffer=[]
              def handle_data(self, data):
                  if self.active: self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active:
                      self.inline.append(''.join(self.buffer)); self.active=False
          p=Scripts(); p.feed(Path('dashboard.html').read_text())
          for i,script in enumerate(p.inline):
              if script.strip(): Path(f'/tmp/jobpilot-inline-{i}.mjs').write_text(script)
          PY
          for file in /tmp/jobpilot-inline-*.mjs; do [ -e "$file" ] || continue; node --check "$file"; done
      - name: Run full regression suite
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
